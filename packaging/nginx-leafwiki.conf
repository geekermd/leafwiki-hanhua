# LeafWiki 的 HTTPS 终结示例（仅监听回环，供 cloudflared 以 https://localhost:8443 回源）
# 放进 /etc/nginx/sites-available/leafwiki.conf，软链到 sites-enabled 后 nginx -t && systemctl reload nginx
server {
    listen 127.0.0.1:8443 ssl;
    server_name wiki.example.com localhost;

    ssl_certificate     /etc/leafwiki/ssl/leafwiki.crt;
    ssl_certificate_key /etc/leafwiki/ssl/leafwiki.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:LeafWiki:2m;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
